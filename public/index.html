<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>SLAV AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">S</div><div><b>SLAV AI</b><small>Твой облачный помощник</small></div></div>
      <button id="newChat" class="new-chat">＋ Новый чат</button>
      <div class="side-label">РЕЖИМ РАБОТЫ</div>
      <div class="modes">
        <button class="mode active" data-mode="chat">💬 Обычный чат</button>
        <button class="mode" data-mode="think">🧠 Глубокий анализ</button>
        <button class="mode" data-mode="code">⌘ Программирование</button>
        <button class="mode" data-mode="research">⌕ Исследование</button>
      </div>
      <div class="side-bottom"><span id="statusDot"></span><span id="statusText">Проверка подключения…</span></div>
    </aside>
    <main class="main">
      <header><button id="menuBtn" class="menu-btn">☰</button><div><b id="modeTitle">Обычный чат</b><small>SLAV AI · Cloud</small></div><button id="exportBtn" class="export">Экспорт</button></header>
      <section id="messages" class="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">S</div>
          <h1>Привет! Я SLAV AI.</h1>
          <p>Чем займёмся сегодня?</p>
          <div class="suggestions">
            <button data-prompt="Помоги мне составить план проекта">Составить план проекта</button>
            <button data-prompt="Напиши и объясни код для моей задачи">Помочь с программированием</button>
            <button data-prompt="Объясни сложную тему простыми словами">Объяснить сложную тему</button>
          </div>
        </div>
      </section>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Напиши сообщение SLAV AI…"></textarea>
          <button id="sendBtn" aria-label="Отправить">➤</button>
        </div>
        <div class="hint">SLAV AI может ошибаться. Проверяй важную информацию.</div>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
